<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rallybox Manual — cover (preview)</title>
<style>
  :root { --ink: #111; --rule: #bbb; --shade: #f4f4f4; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 11pt; line-height: 1.45; color: var(--ink);
    max-width: 180mm; margin: 0 auto; padding: 15mm;
    background: #fff;
  }
  h1 {
    font-size: 17pt; margin: 0 0 4mm; padding-bottom: 2mm;
    border-bottom: 2px solid var(--ink);
  }
  p { margin: 0 0 2.5mm; }
  .screen { margin: 0 0 4mm; }
  .screen img {
    display: block; width: 100%; height: auto;
    border: 1px solid var(--rule);
  }
  .screen figcaption { font-size: 9pt; color: #555; margin-top: 1mm; }
  @page { size: A4 portrait; margin: 15mm; }
  @media print { body { max-width: none; margin: 0; padding: 0; font-size: 10pt; } }
</style>
</head>
<body>

<div style="page-break-after: always">

<h1 id="top">Rallybox User Manual</h1>

<figure class="screen">
  <img src="manual-images/main-screen.png" alt="The co-pilot screen in two-display mode">
  <figcaption>Co-pilot screen, two-display mode.</figcaption>
</figure>

<figure class="screen">
  <img src="manual-images/driver-screen.png" alt="The driver display" style="width: 62.5%; margin-left: auto; margin-right: auto">
  <figcaption>Driver display.</figcaption>
</figure>

<figure class="screen">
  <img src="manual-images/single-display.png" alt="The co-pilot screen in single-display mode">
  <figcaption>Co-pilot screen, single-display mode.</figcaption>
</figure>

</div>

</body>
</html>
