<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Historic Rally Meter</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1>Historic Rally Meter</h1>
    <div id="conn" class="conn">connecting…</div>
  </header>

  <nav class="tabs">
    <button id="tab-live" class="tab active" type="button">Live</button>
    <button id="tab-setup" class="tab" type="button">Setup</button>
  </nav>

  <main id="view-live" class="view">
    <section class="clock-row">
      <span>Rally Clock</span>
      <strong id="rally-clock">--:--:--</strong>
    </section>

    <section id="ahead-behind" class="ahead-behind">
      <div class="label">AHEAD / BEHIND</div>
      <div id="ahead-value" class="value">0.0 s</div>
    </section>

    <section class="speed-grid">
      <div><span>Current</span><strong id="cur-kph">0.0</strong> <small id="unit-label">kph</small></div>
      <div><span>Target</span><strong id="target-kph">0.0</strong> <small id="unit-label2">kph</small></div>
    </section>

    <section class="dist-grid">
      <div><span>Trip</span><strong id="trip-m">0 m</strong><span id="trip-avg">avg 0.0</span></div>
      <div><span>Total</span><strong id="total-m">0 m</strong><span id="total-avg">avg 0.0</span></div>
    </section>

    <section class="actions">
      <button id="btn-next-prev" type="button" disabled>---&gt;</button>
      <button id="btn-reset-trip" type="button">Reset Trip</button>
    </section>

    <section class="adjust-row">
      <span class="adjust-label">Adjust</span>
      <button id="btn-dist-minus" type="button">&minus;10</button>
      <input id="dist-set-m" type="number" min="0" max="999999" step="1"
             inputmode="numeric" placeholder="Total m">
      <button id="btn-dist-set" type="button">set</button>
      <button id="btn-dist-plus" type="button">+10</button>
    </section>

    <section class="segment-row">
      Segment <strong id="seg-num">0</strong> of <strong id="seg-count">0</strong>
    </section>

    <!-- The co-pilot's read-only stage panel, same figures in the same order:
         the roadbook as set, each segment's own length, and the running total
         the crew read off against the odometer. -->
    <section class="stage-panel">
      <div class="stage-autostart">Autostart: <strong id="stage-autostart">none</strong></div>
      <table id="stage-table">
        <thead>
          <tr><th id="stage-speed-head">KPH</th><th colspan="2">Distance (m)</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

  </main>

  <main id="view-setup" class="view hidden">
    <div class="table-wrap">
      <table id="seg-table">
        <thead>
          <tr><th>#</th><th>Target kph</th><th>Distance m</th><th>Auto</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button id="btn-add-seg" type="button">+ Add segment</button>
    <section class="memory-row">
      <span class="mem-label">Store</span>
      <button class="mem-slot" data-action="store" data-slot="1" type="button">1</button>
      <button class="mem-slot" data-action="store" data-slot="2" type="button">2</button>
      <button class="mem-slot" data-action="store" data-slot="3" type="button">3</button>
      <button class="mem-slot" data-action="store" data-slot="4" type="button">4</button>
      <button class="mem-slot" data-action="store" data-slot="5" type="button">5</button>
    </section>
    <section class="memory-row">
      <span class="mem-label">Recall</span>
      <button class="mem-slot" data-action="recall" data-slot="1" type="button">1</button>
      <button class="mem-slot" data-action="recall" data-slot="2" type="button">2</button>
      <button class="mem-slot" data-action="recall" data-slot="3" type="button">3</button>
      <button class="mem-slot" data-action="recall" data-slot="4" type="button">4</button>
      <button class="mem-slot" data-action="recall" data-slot="5" type="button">5</button>
    </section>

    <section class="beep-panel">
      <h2>Beep Assist KM</h2>
      <textarea id="beep-waypoints" rows="2"
                placeholder="3.67, 4.98, 17.30"></textarea>
      <div class="beep-row">
        <label for="beep-enabled">Off/On</label>
        <input id="beep-enabled" type="checkbox">
      </div>
      <div class="beep-row beep-head">
        <span>Mode</span><span>Advance by</span>
      </div>
      <div class="beep-row">
        <label for="beep-nav">Navigation</label>
        <input id="beep-nav" type="checkbox">
        <input id="beep-advance-m" type="number" min="0" step="1" inputmode="numeric"
               placeholder="Metres">
      </div>
      <div class="beep-row">
        <label for="beep-timing">Timing</label>
        <input id="beep-timing" type="checkbox">
        <input id="beep-advance-s" type="number" min="0" step="1" inputmode="numeric"
               placeholder="Seconds">
      </div>
    </section>

    <section class="beep-panel">
      <div class="beep-row">
        <label for="tone-enabled">tone off/on</label>
        <input id="tone-enabled" type="checkbox">
      </div>
      <div class="beep-row">
        <span>Type</span>
        <label><input type="radio" name="tone-type" value="1"> 1</label>
        <label><input type="radio" name="tone-type" value="2"> 2</label>
      </div>
    </section>
    <section class="actions">
      <button id="btn-reset-trip2" type="button">Reset Trip</button>
      <button id="btn-reset-total" type="button">Reset Total</button>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
